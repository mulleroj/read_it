# M7.3 – Publish ONLY the built public application surface (dist/).
# Build copies index.html, styles/, src/, content/ – never docs/, tools/, tests/, scripts/.

[build]
  command = "npm run build:public"
  publish = "dist"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/src/vendor/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# M8.2 – after public audio deploy, serve staged TTSMaker MP3 with correct MIME type.
[[headers]]
  for = "/assets/audio/*.mp3"
  [headers.values]
    Content-Type = "audio/mpeg"

# Defense in depth – these paths must never be reachable even after misconfiguration.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.wav"
  to = "/404.html"
  status = 404
  force = true
